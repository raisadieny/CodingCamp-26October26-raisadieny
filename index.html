<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- Header / Balance -->
    <header class="header">
      <h1 class="app-title">💰 Budget Tracker</h1>
      <div class="balance-card">
        <span class="balance-label">Total Spent</span>
        <span class="balance-amount" id="total-balance">Rp 0</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">

      <!-- Input Form -->
      <section class="card form-section">
        <h2 class="section-title">Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              placeholder="e.g. Lunch, Grab, Cinema"
              autocomplete="off"
            />
            <span class="error-msg" id="err-name"></span>
          </div>

          <div class="form-group">
            <label for="item-amount">Amount (Rp)</label>
            <input
              type="number"
              id="item-amount"
              placeholder="e.g. 25000"
              min="1"
            />
            <span class="error-msg" id="err-amount"></span>
          </div>

          <div class="form-group">
            <label for="item-category">Category</label>
            <select id="item-category">
              <option value="">-- Select category --</option>
              <option value="Food">🍔 Food</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Fun">🎉 Fun</option>
            </select>
            <span class="error-msg" id="err-category"></span>
          </div>

          <button type="submit" class="btn-add">+ Add Transaction</button>
        </form>
      </section>

      <!-- Chart -->
      <section class="card chart-section">
        <h2 class="section-title">Spending by Category</h2>
        <div class="chart-wrapper">
          <canvas id="spending-chart"></canvas>
          <p class="chart-empty" id="chart-empty">No data yet. Add a transaction to see the chart.</p>
        </div>
      </section>

      <!-- Transaction List -->
      <section class="card list-section">
        <h2 class="section-title">Transactions</h2>
        <ul class="transaction-list" id="transaction-list">
          <li class="empty-state" id="empty-state">No transactions yet. Start by adding one above!</li>
        </ul>
      </section>

    </main>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
